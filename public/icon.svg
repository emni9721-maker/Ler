<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="zero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#07090c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer security shield ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#zero-grad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#10b981" stroke-width="4" opacity="0.6" />

  <!-- Core ZERO Shield Emblem -->
  <path d="M 256 100 L 370 150 C 370 280 256 370 256 400 C 256 370 142 280 142 150 Z" 
        fill="#0c1017" stroke="url(#zero-grad)" stroke-width="12" filter="url(#glow)" />

  <!-- Stylized Z Symbol -->
  <path d="M 200 190 L 312 190 L 210 320 L 315 320" 
        fill="none" stroke="url(#zero-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Security Core Dot -->
  <circle cx="256" cy="255" r="12" fill="#10b981" filter="url(#glow)" />
</svg>
